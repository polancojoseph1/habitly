name: habitly

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the server .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the server .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env file}
    volumes:
      - habitly_postgres_data:/var/lib/postgresql/data
      - ./schema.postgres.sql:/docker-entrypoint-initdb.d/001-habitly-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      HABITLY_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the server .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        HABITLY_API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    environment:
      HABITLY_API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HABITLY_WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  habitly_postgres_data:
