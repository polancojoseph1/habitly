services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/habitly.db
    ports: ["8000:8000"]
    volumes:
      - ./backend:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      HABITLY_API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on: [api]
