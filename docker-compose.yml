name: habitly-prod

services:
  api:
    image: ghcr.io/polancojoseph1/habitly-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      HABITLY_ENV: production
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: sqlite:////data/habitly.db
      CORS_ORIGINS: https://habitly.srv1353882.hstgr.cloud
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - habitly_data:/data
    networks:
      - app
      - traefik
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ghcr.io/polancojoseph1/habitly-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      HABITLY_API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: n8n_default
      traefik.http.routers.habitly-prod.rule: Host(`habitly.srv1353882.hstgr.cloud`)
      traefik.http.routers.habitly-prod.entrypoints: websecure
      traefik.http.routers.habitly-prod.tls: "true"
      traefik.http.routers.habitly-prod.tls.certresolver: mytlschallenge
      traefik.http.routers.habitly-prod.service: habitly-prod-web
      traefik.http.services.habitly-prod-web.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  habitly_data:

networks:
  app:
    internal: true
  traefik:
    external: true
    name: n8n_default
