name: Build and deploy Habitly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run API tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web application
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/polancojoseph1/habitly-api:${{ github.sha }}
            ghcr.io/polancojoseph1/habitly-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            HABITLY_API_INTERNAL_URL=http://api:8000
          tags: |
            ghcr.io/polancojoseph1/habitly-web:${{ github.sha }}
            ghcr.io/polancojoseph1/habitly-web:latest

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.HOSTINGER_DEPLOY_ENABLED == 'true' &&
      vars.HOSTINGER_VM_ID != '' &&
      vars.PRODUCTION_DOMAIN != '' &&
      vars.HOSTINGER_TRAEFIK_CERT_RESOLVER != ''
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment Compose file
        uses: actions/checkout@v4

      - name: Deploy Habitly production project
        id: deploy
        continue-on-error: true
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: habitly-prod
          docker-compose-path: docker-compose.yml
          environment-variables: |
            IMAGE_TAG=${{ github.sha }}
            PRODUCTION_DOMAIN=${{ vars.PRODUCTION_DOMAIN }}
            HOSTINGER_TRAEFIK_CERT_RESOLVER=${{ vars.HOSTINGER_TRAEFIK_CERT_RESOLVER }}
            DATABASE_URL=sqlite:////data/habitly.db
            CORS_ORIGINS=https://${{ vars.PRODUCTION_DOMAIN }}

      - name: Check public health route
        id: health
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          set -eu
          attempt=0
          while [ "$attempt" -lt 36 ]; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "https://${PRODUCTION_DOMAIN}/health" || true)
            if [ "$status" = 200 ]; then
              echo "Habitly health route returned HTTP 200."
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
          echo "Habitly did not become healthy at https://${PRODUCTION_DOMAIN}/health" >&2
          exit 1

      - name: Roll back to the previous commit image
        id: rollback
        if: >-
          (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure') &&
          github.event_name == 'push' &&
          github.event.before != '' &&
          github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: habitly-prod
          docker-compose-path: docker-compose.yml
          environment-variables: |
            IMAGE_TAG=${{ github.event.before }}
            PRODUCTION_DOMAIN=${{ vars.PRODUCTION_DOMAIN }}
            HOSTINGER_TRAEFIK_CERT_RESOLVER=${{ vars.HOSTINGER_TRAEFIK_CERT_RESOLVER }}
            DATABASE_URL=sqlite:////data/habitly.db
            CORS_ORIGINS=https://${{ vars.PRODUCTION_DOMAIN }}

      - name: Fail if deployment or rollback failed
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" = failure ] || [ "$HEALTH_OUTCOME" = failure ]; then
            echo "Deployment did not pass its health check. Rollback result: ${ROLLBACK_OUTCOME:-not available}." >&2
            exit 1
          fi
