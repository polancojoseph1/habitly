name: Build and deploy Habitly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run API tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web application
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/polancojoseph1/habitly-api:${{ github.sha }}
            ghcr.io/polancojoseph1/habitly-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            HABITLY_API_INTERNAL_URL=http://api:8000
          tags: |
            ghcr.io/polancojoseph1/habitly-web:${{ github.sha }}
            ghcr.io/polancojoseph1/habitly-web:latest

  deploy:
    if: github.ref == 'refs/heads/main' && vars.HABITLY_DEPLOY_ENABLED == 'true'
    needs: build-and-push
    concurrency:
      group: habitly-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH credentials and verified host key
        env:
          DEPLOY_KEY: ${{ secrets.HABITLY_DEPLOY_PRIVATE_KEY }}
          VERIFIED_KNOWN_HOSTS: ${{ secrets.HABITLY_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$VERIFIED_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Deploy the SHA-tagged image through the restricted wrapper
        id: deploy
        continue-on-error: true
        env:
          SERVER_HOST: ${{ vars.HABITLY_SERVER_HOST }}
          SERVER_PORT: ${{ vars.HABITLY_SERVER_PORT }}
          SERVER_USER: ${{ vars.HABITLY_SERVER_USER }}
          DEPLOY_TAG: ${{ github.sha }}
        run: |
          set -eu
          printf '%s\n' "$DEPLOY_TAG" | ssh -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'umask 077; cat > "$HOME/.habitly-deploy-request.incoming"; mv "$HOME/.habitly-deploy-request.incoming" "$HOME/.habitly-deploy-request"'
          ssh -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'sudo -n /usr/local/sbin/habitly-deploy'

      - name: Check the public HTTPS health route
        id: health
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          PRODUCTION_DOMAIN: habitly.srv1353882.hstgr.cloud
        run: |
          set -eu
          attempt=0
          while [ "$attempt" -lt 36 ]; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "https://${PRODUCTION_DOMAIN}/health" || true)
            if [ "$status" = 200 ]; then
              echo "Habitly health route returned HTTP 200."
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
          echo "Habitly did not become healthy at https://${PRODUCTION_DOMAIN}/health" >&2
          exit 1

      - name: Roll back if the external health check fails
        id: rollback
        if: steps.health.outcome == 'failure'
        continue-on-error: true
        env:
          SERVER_HOST: ${{ vars.HABITLY_SERVER_HOST }}
          SERVER_PORT: ${{ vars.HABITLY_SERVER_PORT }}
          SERVER_USER: ${{ vars.HABITLY_SERVER_USER }}
        run: |
          set -eu
          printf '%s\n' rollback | ssh -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'umask 077; cat > "$HOME/.habitly-deploy-request.incoming"; mv "$HOME/.habitly-deploy-request.incoming" "$HOME/.habitly-deploy-request"'
          ssh -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'sudo -n /usr/local/sbin/habitly-deploy'

      - name: Stop the old API after production passes health checks
        id: retire_old_api
        if: steps.health.outcome == 'success'
        env:
          SERVER_HOST: ${{ vars.HABITLY_SERVER_HOST }}
          SERVER_PORT: ${{ vars.HABITLY_SERVER_PORT }}
          SERVER_USER: ${{ vars.HABITLY_SERVER_USER }}
        run: |
          set -eu
          printf '%s\n' retire-old-api | ssh -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'umask 077; cat > "$HOME/.habitly-deploy-request.incoming"; mv "$HOME/.habitly-deploy-request.incoming" "$HOME/.habitly-deploy-request"'
          ssh -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'sudo -n /usr/local/sbin/habitly-deploy'

      - name: Fail if deployment or health check failed
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          RETIRE_OUTCOME: ${{ steps.retire_old_api.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" = failure ] || [ "$HEALTH_OUTCOME" = failure ] || [ "$RETIRE_OUTCOME" = failure ]; then
            echo "Deployment or post-deployment checks failed. Rollback result: ${ROLLBACK_OUTCOME:-not required}." >&2
            exit 1
          fi
